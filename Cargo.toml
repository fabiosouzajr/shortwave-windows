[package]
name = "shortwave"
version = "0.0.0"
authors = ["Felix Häcker <haeckerfelix@gnome.org>"]
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
async-channel = "2.3"
async-compat = "0.2"
async-io = "2.4"
async-std-resolver = "0.24"
cacache = "13.1"
cast-sender = "0.2"
diesel = { version = "2.2", features = ["sqlite", "r2d2"] }
diesel_migrations = "2.2"
futures-util = "0.3"
indexmap = "2.7"
Inflector = "0.11"
language-tags = "0.3"
log = "0.4"
mdns-sd = "0.13"
pretty_env_logger = "0.5"
rand = "0.8"
regex = "1.11"
reqwest = "0.12"
sanitize-filename = "0.6"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
serde_urlencoded = "0.7"
strum = "0.26"
strum_macros = "0.26"
sys-locale = "0.3"
thiserror = "1.0"
url = "2.5"
uuid = { version = "1.11", features = ["v4"] }

gstreamer-audio = { version = "0.23" }
gstreamer = { version = "0.23"}
shumate = { version = "0.6", package = "libshumate"}
gettext-rs = { version = "0.7", features = ["gettext-system"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_7"] }
gtk = { version = "0.9", package = "gtk4", features = ["gnome_46"] }

# Freedesktop integration (background portal, sandboxed image loading, MPRIS).
# Kept for every non-Windows target so the upstream build is unchanged.
[target.'cfg(not(windows))'.dependencies]
ashpd = { version = "0.10", default-features = false, features=["gtk4", "async-std"] }
glycin = { version = "2.0", features = ["gdk4"] }
mpris-server = "0.8"

# Windows integration (SMTC media controls).
# Note: gdk4-win32 0.9 can't be used, it links against
# gdk_win32_display_get_win32hcursor, which GTK 4.24 no longer exports.
[target.'cfg(windows)'.dependencies]
souvlaki = { version = "0.9", default-features = false }
tray-icon = { version = "0.26", default-features = false }
# Toast notifications and the process AppUserModelID (same version as souvlaki's)
windows = { version = "0.62", features = ["Foundation", "Data_Xml_Dom", "UI_Notifications", "Win32_UI_Shell"] }

# Icon, version information and manifest (see build.rs)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"